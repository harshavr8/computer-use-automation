{% extends "_layout.html" %}{% set title = "SIGN ON" %}
{% block body %}
<script>if (window.top !== window.self) { window.top.location = window.location.href; }</script>
<table width="420" cellpadding="0" cellspacing="0" border="1" bgcolor="#ffffff">
<tr><td class="bar">{{ v.brand }} &nbsp;&nbsp; {{ v.product_version }}</td></tr>
<tr><td>
  <form method="post" action="/login" target="_top">
  <table cellpadding="4">
    <tr><td colspan="2"><b>OPERATOR SIGN ON</b></td></tr>
    {% if expired %}<tr><td colspan="2"><span class="msg">SGN-009 SESSION EXPIRED - PLEASE SIGN ON AGAIN</span></td></tr>{% endif %}
    {% if error %}<tr><td colspan="2"><span class="msg">{{ error }}</span></td></tr>{% endif %}
    <tr><td align="right">Operator ID:</td><td><input type="text" name="f1" size="16"></td></tr>
    <tr><td align="right">Password:</td><td><input type="password" name="f2" size="16"></td></tr>
    <tr><td></td><td><input type="submit" value="Sign On"></td></tr>
  </table>
  </form>
</td></tr>
</table>
{% endblock %}
