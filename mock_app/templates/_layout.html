{#- Intentionally legacy: no doctype (quirks mode), table layout, no ids,
    no test ids, no semantic headings, no <label for>. -#}
<html>
<head>
<title>{{ v.brand }} - {{ title|default('MEMBER SERVICING') }}</title>
<style>
body { font-family: Verdana, Arial, sans-serif; font-size: 11px; background: #d4d0c8; margin: 4px; }
td { font-size: 11px; }
.bar { background: #0a246a; color: #ffffff; font-weight: bold; padding: 2px 4px; }
.sub { background: #a6caf0; font-weight: bold; }
.grid td { border: 1px solid #808080; padding: 2px 5px; background: #ffffff; }
.grid tr.hd td { background: #c0c0c0; font-weight: bold; }
.msg { color: #cc0000; font-weight: bold; }
.ok { color: #006600; font-weight: bold; }
a { color: #0000cc; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
